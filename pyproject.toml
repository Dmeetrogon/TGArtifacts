[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tgartifacts"
version = "0.2.0"
description = "CLI forensic tool for Telegram Desktop artifact analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Dmeetrogon"}
]
keywords = ["telegram", "forensics", "tdata", "cli", "blue-team", "mitre-attack", "dfir"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Forensics",
    "Environment :: Console",
]

dependencies = [
    "click>=8.1.0",
    "tgcrypto>=1.2.5",
    "rich>=13.0.0",
    "python-magic-bin>=0.4.14; sys_platform == 'win32'",
    "python-magic>=0.4.27; sys_platform != 'win32'",
]

[project.urls]
Homepage = "https://github.com/Dmeetrogon/TGArtifacts"
Repository = "https://github.com/Dmeetrogon/TGArtifacts"
Issues = "https://github.com/Dmeetrogon/TGArtifacts/issues"

[project.optional-dependencies]
validate-session = ["telethon>=2.0"]
all = ["telethon>=2.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-html>=4.0.0",
]

[project.scripts]
tgartifacts = "tgartifacts.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["tgartifacts*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--html=reports/report.html --self-contained-html"
markers = [
    "live: tests that hit real Telegram API",
    "slow: slow tests (bruteforce)",
]
